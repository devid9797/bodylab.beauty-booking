<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>404 – BodyLab.Beauty</title>
<link rel="icon" type="image/png" href="/images/favicon.png">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4ECE2;
    --card:#FFFEFA;
    --border:#EFE3D2;
    --accent:#4B4743;
    --accent-soft:#847F79;
    --text:#5C5854;
    --text-soft:#9C968E;
    --chip-bg:#F4ECE2;
    --chip-border:#E6DBCB;
    --chip-hover:#EFE6D8;
    --chip-selected:#4B4743;
    --glow:#847F79;
    --glow-soft:rgba(75,71,67,.3);
    --day-muted:#D2CFC9;
    --shadow-sm:0 2px 10px rgba(75,71,67,.07);
    --shadow-md:0 10px 30px rgba(75,71,67,.1);
    --shadow-lift:0 16px 40px rgba(75,71,67,.16);
    --shadow-dual:0 8px 28px rgba(75,71,67,.09),0 1px 2px rgba(75,71,67,.08);
    --ease:cubic-bezier(.16,1,.3,1);
    --ease-drawer:cubic-bezier(.32,.72,0,1);
    --radius-card:24px;
    --radius-section:30px;
    --radius-pill:999px;
    --radius-tag:12px;
    --radius-image:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
  body{
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:1.5rem 1rem calc(3rem + env(safe-area-inset-bottom));
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:440px;width:100%}
  .card{
    background:var(--card);
    border-radius:var(--radius-card);
    padding:1.25rem;
    margin-bottom:1rem;
    box-shadow:var(--shadow-dual);
    transition:box-shadow .3s var(--ease);
  }
  h1,h2{font-family:'Montserrat',sans-serif;font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--accent);margin-bottom:2px;text-align:center}
  .sub{font-size:13px;color:var(--accent-soft);text-align:center;margin-bottom:1rem}
  .divider{width:36px;height:1px;background:var(--chip-border);margin:.75rem auto}

  /* ---------- Scroll-reveal (motivated: draws the eye down the booking flow in reading order) ----------
     Progressive enhancement: cards are visible by default. JS adds .pre-reveal only if it runs,
     so a script failure can never leave content stuck invisible. */
  .card.pre-reveal{opacity:0;transform:translateY(14px)}
  .card.pre-reveal.in-view{opacity:1;transform:translateY(0);transition:opacity .45s var(--ease),transform .45s var(--ease),box-shadow .3s var(--ease)}
  @media (prefers-reduced-motion:reduce){
    .card.pre-reveal{opacity:1;transform:none}
  }

  /* ---------- Language switch ---------- */
  .lang-switch{
    position:absolute;top:14px;right:14px;z-index:5;
  }
  .lang-toggle{
    display:flex;align-items:center;gap:6px;
    padding:6px 10px;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.5);
    background:rgba(255,254,250,.78);
    backdrop-filter:blur(12px) saturate(160%);
    -webkit-backdrop-filter:blur(12px) saturate(160%);
    color:var(--accent);
    font-size:12px;font-weight:700;letter-spacing:.02em;
    cursor:pointer;font-family:inherit;
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .lang-toggle svg{width:9px;height:9px;transition:transform .2s ease}
  .lang-switch.open .lang-toggle svg{transform:rotate(180deg)}
  .lang-menu{
    position:absolute;top:calc(100% + 6px);right:0;
    background:var(--card);
    border:1px solid var(--chip-border);
    border-radius:10px;
    padding:4px;
    min-width:68px;
    box-shadow:var(--shadow-md);
    display:flex;
    flex-direction:column;
    gap:2px;
    transform-origin:top right;
    opacity:0;
    transform:scale(.95) translateY(-4px);
    visibility:hidden;
    transition:opacity .16s var(--ease),transform .16s var(--ease),visibility 0s linear .16s;
  }
  .lang-switch.open .lang-menu{
    opacity:1;
    transform:scale(1) translateY(0);
    visibility:visible;
    transition:opacity .16s var(--ease),transform .16s var(--ease),visibility 0s linear 0s;
  }
  @media (prefers-reduced-motion:reduce){
    .lang-menu{transition:opacity .16s var(--ease),visibility 0s linear .16s;transform:none}
    .lang-switch.open .lang-menu{transform:none}
  }
  .lang-option{
    padding:7px 10px;border-radius:6px;
    border:none;background:none;
    color:var(--text);font-size:12px;font-weight:600;text-align:left;
    cursor:pointer;font-family:inherit;text-decoration:none;display:block;
  }
  .lang-option.active{background:var(--accent);color:var(--card)}

  /* ---------- Hero / intro ---------- */
  .hero-card{padding:0;overflow:hidden;border-radius:var(--radius-section)}
  #calendar-card{border-radius:var(--radius-section)}
  .hero-photo{
    height:220px;
    position:relative;
    background:
      linear-gradient(180deg, transparent 65%, var(--card) 100%),
      linear-gradient(180deg, rgba(0,0,0,.05) 0%, rgba(0,0,0,.18) 100%),
      url('/images/hero.jpg');
    background-size:cover;
    background-position:center;
    overflow:hidden;
  }
  .hero-logo-wrap{display:flex;justify-content:center;margin-top:-45px;position:relative;z-index:2}
  .hero-logo{
    width:90px;height:90px;border-radius:50%;
    background:var(--card);
    box-shadow:var(--shadow-md);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .hero-logo img{width:68%;height:auto;object-fit:contain}
  .hero-content{padding:10px 1.25rem 1.5rem;text-align:center}
  .hero-content h1{font-size:19px;letter-spacing:.03em;text-transform:uppercase}
  .hero-tagline{font-size:13px;color:var(--text-soft);margin:6px 0 14px;line-height:1.55}
  .social-row{display:flex;justify-content:center;gap:12px}
  .social-btn{
    width:36px;height:36px;border-radius:50%;
    border:1px solid var(--chip-border);
    background:var(--card);
    display:flex;align-items:center;justify-content:center;
    color:var(--accent);
    transition:background .2s var(--ease),transform .2s var(--ease),border-color .2s var(--ease);
  }
  .social-btn:active{transform:translateY(0) scale(.94)}
  .social-btn svg{width:17px;height:17px}

  .empty,.loading,.error{font-size:13px;color:var(--text-soft);text-align:center;padding:1rem 0}
  .loading{display:flex;flex-direction:column;align-items:center;gap:10px}
  .loading-spinner{
    width:26px;height:26px;
    border:3px solid var(--chip-border);
    border-top-color:var(--accent);
    border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){
    .loading-spinner{animation:none}
  }

  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-nav-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--chip-border);
    background:var(--card);color:var(--accent);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s var(--ease),transform .15s var(--ease);
  }
  .cal-nav-btn:disabled{opacity:.3;cursor:default}
  .cal-nav-btn:not(:disabled):active{transform:scale(.9)}
  .cal-month-label{font-family:'Montserrat',sans-serif;font-size:18px;font-weight:700;letter-spacing:-.015em;color:var(--accent);text-transform:capitalize}

  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
  .cal-weekdays span{
    font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    color:var(--text-soft);text-align:center
  }

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
  .cal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center}
  .cal-day{
    position:relative;
    width:38px;height:38px;
    border:none;background:none;
    border-radius:50%;
    font-size:14px;font-weight:500;
    color:var(--day-muted);
    cursor:default;
    display:flex;align-items:center;justify-content:center;
    font-family:'Montserrat',sans-serif;
    transition:background .2s var(--ease),transform .15s var(--ease);
  }
  .cal-day.available{
    color:var(--accent);
    cursor:pointer;
    font-weight:600;
  }
  .cal-day.available::before{
    content:'';
    position:absolute;
    inset:-4px;
    border-radius:50%;
    background:radial-gradient(circle,var(--glow-soft) 0%,transparent 72%);
    animation:glow-pulse 2.6s ease-in-out infinite;
  }
  .cal-day.available:active{transform:scale(.88)}
  .cal-day.today{box-shadow:inset 0 0 0 1px var(--chip-border)}
  .cal-day.preview{cursor:default;opacity:.5}
  .cal-day.preview::before{animation:none;opacity:.25}
  .cal-updating-hint{font-size:12px;color:var(--text-soft);text-align:center;margin:-4px 0 12px}
  @keyframes glow-pulse{
    0%,100%{opacity:.55;transform:scale(.9)}
    50%{opacity:1;transform:scale(1.08)}
  }
  @media (prefers-reduced-motion:reduce){
    .cal-day.available::before{animation:none;opacity:.8}
  }

  label{display:block;font-size:12px;font-weight:600;color:var(--accent);margin:12px 0 5px}
  label:first-of-type{margin-top:0}
  input,select,textarea{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid var(--chip-border);
    background:var(--card);
    font-size:14px;
    color:var(--text);
    font-family:inherit;
    transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
  }
  textarea{resize:vertical;min-height:72px;line-height:1.4}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent-soft);box-shadow:0 0 0 3px var(--glow-soft)}

  .phone-row{display:flex;gap:8px}
  .phone-code{width:96px;flex:none;padding-left:8px;padding-right:4px}
  .phone-row input{flex:1}

  .selected-slot{
    background:var(--chip-bg);
    border-radius:12px;
    padding:10px 12px;
    font-size:13px;
    color:var(--accent);
    font-weight:600;
    margin-bottom:4px;
  }

  .btn{
    display:block;
    width:100%;
    padding:13px;
    border-radius:var(--radius-pill);
    font-size:14px;
    font-weight:600;
    text-align:center;
    border:none;
    cursor:pointer;
    margin-top:16px;
    font-family:inherit;
    transition:transform .15s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease),opacity .2s var(--ease);
  }
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--accent);color:var(--card);box-shadow:var(--shadow-sm)}
  .btn-primary:disabled{background:var(--day-muted);cursor:not-allowed;box-shadow:none}
  .btn-primary:disabled:active{transform:none}
  .btn-outline{background:var(--card);color:var(--accent);border:1px solid var(--chip-border);text-decoration:none}
  .btn-success{background:#3F9142;color:#fff}
  .btn-danger{background:#B03030;color:#fff}
  .btn-icon{display:flex;align-items:center;justify-content:center;gap:9px}
  .btn-icon svg{width:19px;height:19px;flex:none}
  .btn-back{background:none;color:var(--text-soft);text-decoration:underline;font-weight:500;font-size:12px;margin-top:10px;padding:4px}

  .confirm-cal-row{display:flex;gap:10px;margin-top:16px}
  .confirm-cal-row .btn{flex:1;margin-top:0}

  /* ---------- Directions / location ---------- */
  .directions-card{padding:1.25rem}
  .directions-row{display:flex;gap:10px}
  .directions-row .btn{flex:1;margin-top:0;display:flex;align-items:center;justify-content:center;gap:7px}
  .directions-row svg{width:16px;height:16px;flex:none}
  .location-buildings{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
  .location-buildings img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--radius-image);display:block;box-shadow:var(--shadow-md);cursor:zoom-in;transition:transform .3s var(--ease)}
  .location-photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:14px 0 4px}
  .location-photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-image);display:block;cursor:zoom-in;transition:transform .3s var(--ease)}

  /* ---------- Photo lightbox ---------- */
  .photo-lightbox-backdrop{
    position:fixed;inset:0;z-index:20;
    background:rgba(20,19,18,.9);
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    opacity:0;pointer-events:none;
    visibility:hidden;
    transition:opacity .25s ease,visibility 0s linear .25s;
  }
  .photo-lightbox-backdrop.open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s ease,visibility 0s linear 0s}
  .photo-lightbox-img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .photo-lightbox-close{
    position:fixed;top:18px;right:18px;
    width:38px;height:38px;border-radius:50%;border:none;
    background:rgba(255,255,255,.15);color:#fff;font-size:18px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }

  /* ---------- Products ---------- */
  .brand-strip{display:flex;align-items:center;gap:12px;background:var(--chip-bg);border-radius:14px;padding:12px 14px;margin-bottom:14px}
  .brand-wordmark{flex:none;font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;letter-spacing:.03em;color:var(--accent);line-height:1}
  .brand-wordmark small{display:block;font-weight:600;font-size:7.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);margin-top:3px}
  .brand-strip-text{font-size:11.5px;line-height:1.45;color:var(--text-soft)}
  .products-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px}
  .product-tile{display:flex;flex-direction:column;height:100%;gap:6px;background:none;border:none;padding:0;font-family:inherit;text-align:left;cursor:pointer}
  .product-tile:nth-child(n+4){border-top:1px solid var(--chip-border);padding-top:14px}
  .product-thumb{width:100%;aspect-ratio:1;border-radius:var(--radius-image);background-size:cover;background-position:center;background-color:var(--chip-bg);transition:transform .25s var(--ease)}
  .product-tile:active .product-thumb{transform:scale(.98)}
  .product-tile-name{font-size:12px;font-weight:600;color:var(--accent);line-height:1.3}
  .product-tile-price{
    display:inline-block;align-self:flex-start;margin-top:auto;
    font-size:13px;font-weight:700;color:var(--card);
    background:var(--accent);border-radius:8px;padding:3px 9px;
  }
  .product-sheet-photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-image);margin-bottom:12px;box-shadow:var(--shadow-md)}
  .product-sheet-price{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:2px}
  .product-sheet-sizes{font-size:12px;color:var(--text-soft);margin-bottom:10px}
  .product-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .product-tab-btn{
    padding:7px 13px;border-radius:20px;border:1px solid var(--chip-border);
    background:var(--chip-bg);color:var(--text-soft);font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;
    transition:background .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease);
  }
  .product-tab-btn.active{background:var(--accent);color:var(--card);border-color:var(--accent)}
  .product-tab-btn:active{transform:scale(.96)}
  .product-tab-panel{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:4px}
  .product-tab-panel ul{list-style:none}
  .product-tab-panel li{padding-left:16px;position:relative;margin-bottom:7px}
  .product-tab-panel li::before{content:'•';position:absolute;left:2px;color:var(--accent-soft)}
  .product-tab-panel .ingredient-name{font-weight:600;color:var(--accent)}
  .product-availability{font-size:12px;line-height:1.5;color:var(--text-soft);background:var(--chip-bg);border-radius:10px;padding:10px 12px;margin-top:14px}

  /* ---------- iOS 26 Safari toolbar tint anchor ----------
     Safari 26 tints its own top/bottom chrome by sampling the background-color of a
     position:fixed/sticky element that hugs the viewport edge, instead of reading <body>.
     Our real fixed elements (sheet backdrops, lightbox) are dark and were getting sampled
     even while closed, turning the toolbar black. This dedicated, always-present strip
     gives Safari an unambiguous, correctly-colored edge to read instead. */
  #ios-toolbar-tint-bottom{
    position:fixed;bottom:-8px;left:0;width:100%;min-height:12px;
    background:var(--bg);
    display:none;
    pointer-events:none;
  }
  @supports (-webkit-text-size-adjust:none) and (font:-apple-system-body) and (-webkit-touch-callout:none){
    @media (max-width:767px){
      #ios-toolbar-tint-bottom{display:block}
    }
  }

  /* ---------- Floating contact button ---------- */
  .fab-contact{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:9;display:flex;flex-direction:column;align-items:center;gap:12px}
  .fab-option{
    width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.2);
    opacity:0;transform:translateY(8px) scale(.9);pointer-events:none;
    transform-origin:bottom center;
    transition:opacity .18s var(--ease),transform .18s var(--ease);
  }
  .fab-option svg{width:22px;height:22px}
  .fab-option.fab-whatsapp{background:#25D366}
  .fab-option.fab-instagram{background:radial-gradient(circle at 30% 110%,#fdf497,#fdf497,#fd5949,#d6249f,#285AEB)}
  .fab-contact.open .fab-option{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
  .fab-contact.open .fab-option:nth-child(2){transition-delay:40ms}
  .fab-toggle{
    width:58px;height:58px;border-radius:50%;border:none;background:var(--accent);color:var(--card);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:var(--shadow-lift);transition:transform .2s var(--ease),box-shadow .2s var(--ease);
  }
  .fab-toggle:active{transform:scale(.95)}

  /* ---------- Cookie consent banner (only shown once Google tags are configured) ---------- */
  .consent-banner{
    position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:12;
    max-width:520px;margin:0 auto;padding:16px 18px;
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius-card);
    box-shadow:var(--shadow-lift);color:var(--text);font-size:13px;line-height:1.5;
  }
  .consent-banner[hidden]{display:none}
  .consent-actions{display:flex;gap:10px;margin-top:12px}
  .consent-actions .btn{flex:1;margin-top:0;padding:11px}
  .fab-toggle svg{width:26px;height:26px;transition:transform .2s var(--ease)}
  .fab-contact.open .fab-toggle svg{transform:rotate(135deg)}

  /* ---------- Stebby ---------- */
  .stebby-logo{width:100%;max-width:260px;height:auto;display:block;margin:0 auto 14px}

  .hint{font-size:11px;color:var(--text-soft);margin-top:4px}

  .times{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
  .time-chip{
    background:var(--chip-bg);
    border:1px solid var(--chip-border);
    color:var(--accent);
    border-radius:var(--radius-tag);
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:background .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease);
    font-family:inherit;
  }
  .time-chip:active{transform:scale(.94)}

  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(20,19,18,.4);
    opacity:0;pointer-events:none;
    visibility:hidden;
    transition:opacity .25s var(--ease),visibility 0s linear .25s;
    z-index:10;
  }
  .sheet-backdrop.open{opacity:1;pointer-events:auto;visibility:visible;transition:opacity .25s var(--ease),visibility 0s linear 0s}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;
    max-width:440px;margin:0 auto;
    background:var(--card);
    border-radius:26px 26px 0 0;
    box-shadow:0 -16px 40px rgba(20,19,18,.16);
    padding:10px 1.25rem calc(1.5rem + env(safe-area-inset-bottom));
    transform:translateY(100%);
    transition:transform .22s var(--ease);
    z-index:11;
    max-height:82vh;
    overflow-y:auto;
  }
  .sheet.open{transform:translateY(0);transition:transform .4s var(--ease-drawer)}
  .sheet-handle{width:36px;height:4px;background:var(--chip-border);border-radius:2px;margin:0 auto 14px;position:relative;touch-action:none;cursor:grab}
  .sheet-handle::before{content:'';position:absolute;inset:-16px -40px}
  .sheet-handle:active{cursor:grabbing}
  .sheet-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  #product-sheet .sheet-header{
    position:sticky;top:0;z-index:2;
    background:rgba(255,254,250,.85);
    backdrop-filter:blur(16px) saturate(160%);
    -webkit-backdrop-filter:blur(16px) saturate(160%);
    padding-bottom:10px;
  }
  .sheet-title{font-family:'Montserrat',sans-serif;font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--accent);text-transform:capitalize}
  .sheet-close{
    width:28px;height:28px;border-radius:50%;border:none;background:var(--chip-bg);
    color:var(--accent-soft);font-size:15px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .2s var(--ease),transform .15s var(--ease);
  }
  .sheet-close:active{transform:scale(.9)}
  .sheet-back{
    font-size:12px;color:var(--text-soft);background:none;border:none;
    cursor:pointer;text-decoration:underline;font-family:inherit;padding:0;margin-bottom:10px;
  }

  /* ---------- Services list ---------- */
  .services-card h2{margin-bottom:2px}
  .service-list{margin-top:.5rem}
  .service-item{border-top:1px solid var(--chip-border)}
  .service-item:first-child{border-top:none}
  .service-head{
    width:100%;
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:14px 2px;
    background:none;
    border:none;
    border-radius:12px;
    text-align:left;
    cursor:pointer;
    font-family:inherit;
    transition:background .2s var(--ease);
  }
  .service-thumb{
    flex:none;
    width:80px;height:80px;
    border-radius:var(--radius-image);
    background-size:cover;
    background-position:center;
    transition:transform .25s var(--ease);
  }
  .service-thumb[data-tone="1"]{background-image:url('/images/service-rsleek.jpg')}
  .service-thumb[data-tone="2"]{background-image:url('/images/service-bflexy.jpg')}
  .service-thumb[data-tone="3"]{background-image:url('/images/service-emszero.jpg')}
  .service-thumb[data-tone="4"]{background-image:url('/images/service-presoterapija.jpg')}
  .service-head-text{flex:1;min-width:0}
  .service-badge{
    display:inline-block;
    background:var(--accent);
    color:var(--card);
    font-size:10px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:uppercase;
    border-radius:5px;
    padding:2px 7px;
    margin-bottom:5px;
  }
  .service-name{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:600;color:var(--accent)}
  .service-tagline{font-size:12.5px;color:var(--text-soft);margin-top:1px}
  .service-chevron{
    flex:none;
    color:var(--text-soft);
    font-size:22px;
    margin-top:8px;
    transition:transform .3s var(--ease);
  }
  .service-item.open .service-chevron{transform:rotate(180deg)}
  .service-item.open .service-head .service-thumb{display:none}

  .service-body{
    display:grid;
    grid-template-rows:0fr;
    transition:grid-template-rows .35s var(--ease);
  }
  .service-item.open .service-body{grid-template-rows:1fr}
  .service-body-inner{overflow:hidden}
  .service-body-content{padding:0 2px 18px 2px}
  .service-body-content .service-thumb-lg{
    width:100%;height:315px;border-radius:var(--radius-image);margin-bottom:12px;
  }
  .service-desc{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px}
  .service-effects-label{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:6px}
  .service-effects{list-style:none;margin-bottom:12px}
  .service-effects li{font-size:13px;color:var(--text);padding-left:16px;position:relative;margin-bottom:4px;line-height:1.4}
  .service-effects li::before{content:'•';position:absolute;left:2px;color:var(--accent-soft)}
  .service-prices{background:var(--chip-bg);border-radius:12px;padding:10px 14px;margin-bottom:4px}
  .service-price-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text);padding:4px 0}
  .service-price-row + .service-price-row{border-top:1px dashed var(--chip-border)}
  .service-price-row span:last-child{font-weight:600;color:var(--accent)}
  .service-book-btn{margin-top:14px}
  .service-more-link{margin-top:8px}

  /* ---------- Footer: graphite card with tappable contact rows + links to every service page ---------- */
  .site-footer{background:var(--accent);color:rgba(255,254,250,.78);font-size:13px;line-height:1.5;text-align:left}
  .footer-brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .footer-brand img{width:52px;height:52px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px rgba(255,254,250,.12)}
  .site-footer .footer-brand h2{color:var(--card);font-size:17px;text-align:left;margin:0 0 2px}
  .footer-brand p{font-size:12.5px;color:rgba(255,254,250,.68)}
  .footer-contacts{font-style:normal;display:grid;gap:8px}
  .footer-contact{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:rgba(255,254,250,.07);color:var(--card);text-decoration:none;transition:background .2s var(--ease),transform .15s var(--ease)}
  .footer-contact:active{transform:scale(.98)}
  .footer-contact small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,254,250,.55)}
  .footer-contact > span:last-child{font-weight:600;font-size:13.5px;min-width:0}
  .footer-icon{width:36px;height:36px;border-radius:50%;background:rgba(255,254,250,.12);display:flex;align-items:center;justify-content:center;flex:none}
  .footer-icon svg{width:17px;height:17px}
  .footer-services-label{margin:18px 0 8px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:rgba(255,254,250,.55)}
  .footer-services{display:flex;flex-wrap:wrap;gap:8px}
  .footer-services a{padding:8px 14px;border-radius:var(--radius-pill);border:1px solid rgba(255,254,250,.22);color:var(--card);font-weight:600;font-size:12.5px;text-decoration:none;transition:background .2s var(--ease)}
  .site-footer .footer-cta{background:var(--card);color:var(--accent);margin-top:18px}
  .footer-bottom{margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,254,250,.12);font-size:11.5px;text-align:center;color:rgba(255,254,250,.5)}
  @media (hover:hover){
    .footer-contact:hover{background:rgba(255,254,250,.13)}
    .footer-services a:hover{background:rgba(255,254,250,.1)}
  }

  /* ---------- Service pages (/lv/r-sleek/ etc.) ---------- */
  .page-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
  .page-top .lang-switch{position:relative;top:auto;right:auto}
  .back-pill{
    display:inline-flex;align-items:center;gap:8px;padding:5px 14px 5px 10px;border-radius:var(--radius-pill);
    background:var(--card);border:1px solid var(--chip-border);box-shadow:var(--shadow-sm);
    color:var(--accent);font-size:13px;font-weight:700;text-decoration:none;
    transition:transform .15s var(--ease),box-shadow .2s var(--ease);
  }
  .back-pill:active{transform:scale(.97)}
  .back-pill img{width:30px;height:30px;border-radius:50%;object-fit:cover}
  .back-pill svg{width:14px;height:14px;flex:none;color:var(--accent-soft)}
  .service-page .location-buildings img,.service-page .location-photos img{cursor:default}
  .home-btn{display:flex;align-items:center;justify-content:center;gap:8px}
  .home-btn svg{width:16px;height:16px;flex:none}
  .service-hero{padding:0;overflow:hidden}
  .service-hero-photo{width:100%;height:auto;aspect-ratio:4/3;object-fit:cover;display:block}
  .service-hero-body{padding:20px 20px 22px}
  .service-hero-body h1{text-align:left;font-size:22px;line-height:1.25;margin-bottom:8px}
  .service-lead{font-size:14px;line-height:1.6;color:var(--text)}
  .content-card h2{text-align:left;font-size:17px;margin-bottom:10px}
  .content-card p{font-size:14px;line-height:1.6;color:var(--text)}
  .content-card p + p{margin-top:8px}
  .content-card .service-effects{margin-top:0}
  .price-table{width:100%;border-collapse:collapse;font-size:14px;color:var(--text)}
  .price-table th,.price-table td{padding:10px 0;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
  .price-table th{font-size:12px;font-weight:600;color:var(--text-soft);text-transform:uppercase;letter-spacing:.04em}
  .price-table td:last-child,.price-table th:last-child{text-align:right;font-weight:700;color:var(--accent);white-space:nowrap}
  .faq-item{border-bottom:1px solid var(--border);padding:12px 0}
  .faq-item:last-child{border-bottom:none}
  .faq-item h3{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:4px}
  .faq-item p{font-size:14px}
  .related-links{display:flex;flex-wrap:wrap;gap:8px}
  .related-links a{flex:1 1 140px;text-align:center;padding:12px;border-radius:var(--radius-tag);border:1px solid var(--chip-border);background:var(--chip-bg);color:var(--accent);font-weight:600;font-size:13px;text-decoration:none}
  a.btn{text-decoration:none}
  .content-card p a{color:var(--accent);font-weight:600}

  /* ---------- Gift card ---------- */
  .gift-photo{
    width:100%;
    aspect-ratio:16/10;
    object-fit:cover;
    border-radius:var(--radius-image);
    display:block;
    margin-bottom:14px;
    box-shadow:var(--shadow-md);
  }
  .gift-desc{font-size:13px;line-height:1.6;color:var(--text);margin-bottom:10px}
  .gift-details-label{font-size:12px;font-weight:600;color:var(--accent);margin-bottom:6px}


  /* ---------- Reviews ---------- */
  .reviews-section{
    margin:0 0 1rem;
    padding:1.25rem 0;
  }
  .reviews-scroll{
    display:flex;gap:26px;
    margin-left:calc(50% - 50vw);
    margin-right:calc(50% - 50vw);
    padding:14px calc(50vw - 50% + 24px) 22px;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .reviews-scroll::-webkit-scrollbar{display:none}
  .reviews-scroll{scrollbar-width:none}
  .review-photo{
    flex:none;width:132px;border-radius:var(--radius-image);
    box-shadow:var(--shadow-md);
    cursor:zoom-in;display:block;
    scroll-snap-align:center;
    transform:rotate(var(--rot,0deg));
    transition:transform .25s var(--ease),box-shadow .25s var(--ease);
  }
  .review-photo:active{transform:scale(1.08) rotate(0deg);box-shadow:var(--shadow-lift)}

  /* ---------- Confirmation popup ---------- */
  #sheet-step-success{min-height:50vh;display:flex;flex-direction:column;position:relative}
  #sheet-step-success #sheet-close-3{position:absolute;top:0;right:0}
  #sheet-step-success .confirm-message{
    font-family:'Montserrat',sans-serif;
    font-size:14px;font-weight:600;color:var(--accent);
    padding-right:30px;margin-bottom:16px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #sheet-step-success .service-prices{padding:14px 16px}
  #sheet-step-success .service-price-row{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 0}
  #sheet-step-success .service-price-row span:first-child{font-size:12px;color:var(--text-soft);font-weight:600}
  #sheet-step-success .service-price-row span:last-child{font-size:16px;text-align:left}
  #sheet-step-success .gift-details-label{font-size:15px;margin-top:22px}
  #sheet-step-success .confirm-cal-row{margin-top:12px;gap:12px}
  #sheet-step-success .confirm-cal-row .btn{font-size:16px;padding:16px}
  #sheet-step-success .hint{font-size:14px;line-height:1.6;margin-top:14px}

  /* ---------- Hover states, gated to real pointers ----------
     Touch devices fire :hover on tap and hold the state until the next tap
     elsewhere, so an ungated :hover here would leave buttons visually
     "stuck" after a tap on a mobile-first booking flow. */
  @media (hover:hover) and (pointer:fine){
    .lang-option:hover{background:var(--chip-bg)}
    .social-btn:hover{background:var(--chip-bg);border-color:var(--accent-soft);transform:translateY(-1px)}
    .cal-nav-btn:not(:disabled):hover{background:var(--chip-bg)}
    .cal-day.available:hover{background:var(--chip-bg)}
    .btn-primary:hover{box-shadow:var(--shadow-md)}
    .btn-outline:hover{background:var(--chip-bg);border-color:var(--accent-soft)}
    .location-buildings img:hover{transform:scale(1.02)}
    .location-photos img:hover{transform:scale(1.04)}
    .review-photo:hover{transform:scale(1.05) rotate(0deg);box-shadow:var(--shadow-lift)}
    .product-tile:hover .product-thumb{transform:scale(1.03)}
    .fab-toggle:hover{transform:scale(1.05)}
    .time-chip:hover{background:var(--chip-hover);border-color:var(--accent-soft)}
    .sheet-close:hover{background:var(--chip-hover)}
    .service-head:hover{background:var(--chip-bg)}
    .service-head:hover .service-thumb{transform:scale(1.04)}
    .product-tab-btn:not(.active):hover{background:var(--chip-hover);color:var(--accent)}
  }

  /* ---------- Reduced transparency: frost the floating materials into solid surfaces ---------- */
  @media (prefers-reduced-transparency:reduce){
    .lang-toggle{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
    #product-sheet .sheet-header{background:var(--card);backdrop-filter:none;-webkit-backdrop-filter:none}
  }

  /* ---------- Desktop / tablet layout ----------
     CSS multi-column (column-count:2) used to reflow cards here, but it just
     balances content top-to-bottom by height - unrelated sections (e.g. the
     calendar and the reviews photo carousel) could land side by side at the
     same vertical position with no logical relationship, and the full-bleed
     reviews carousel broke when squeezed into a half-width column. The site
     stays the single-column mobile layout at every width instead - correct
     and predictable everywhere, which matters more here than filling wide
     screens, since traffic is referral-led straight to a phone. */
</style>
</head>
